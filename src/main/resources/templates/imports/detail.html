<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<main class="container py-5" id="import-status" th:attr="data-import-id=${fileImport.id},data-active=${fileImport.status.name() == 'QUEUED' or fileImport.status.name() == 'RUNNING'}">
  <p class="eyebrow" th:text="#{import.detail.eyebrow}">Import status</p><h1 th:text="${fileImport.originalFilename}"></h1><code th:text="${fileImport.id}"></code>
  <section class="surface p-4 my-4"><div class="d-flex justify-content-between mb-3"><strong id="status" th:text="${progress.statusLabel}"></strong><span id="message" class="text-secondary" th:text="${progress.message}"></span></div><div th:replace="~{fragments/progressBar :: progress}"></div><div class="row g-3 text-center mt-3"><div class="col"><small th:text="#{label.total}">Total</small><strong id="total" class="d-block" th:text="${progress.totalRows}"></strong></div><div class="col"><small th:text="#{label.processed}">Processed</small><strong id="processed" class="d-block" th:text="${progress.processedRows}"></strong></div><div class="col"><small th:text="#{label.successful}">Successful</small><strong id="successful" class="d-block" th:text="${progress.successfulRows}"></strong></div><div class="col"><small th:text="#{label.failed}">Failed</small><strong id="failed" class="d-block" th:text="${progress.failedRows}"></strong></div><div class="col"><small th:text="#{label.skipped}">Skipped</small><strong id="skipped" class="d-block" th:text="${progress.skippedRows}"></strong></div></div></section>
  <section><h2 class="h3" th:text="#{import.errors.title}">Row errors</h2><div th:if="${#lists.isEmpty(errors)}" class="empty-state" th:text="#{import.errors.empty}">No row errors recorded.</div><div th:unless="${#lists.isEmpty(errors)}" class="surface table-responsive"><table class="table mb-0"><thead><tr><th th:text="#{label.line}">Line</th><th th:text="#{label.code}">Code</th><th th:text="#{label.message}">Message</th></tr></thead><tbody><tr th:each="rowError : ${errors}"><td th:text="${rowError.lineNumber}"></td><td><code th:text="${rowError.errorCode}"></code></td><td th:text="${rowError.message}"></td></tr></tbody></table></div></section>
</main>
<script th:src="@{/js/import-progress.js}"></script>
</body>
</html>
