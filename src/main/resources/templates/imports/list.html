<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<main class="container py-5">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <div class="row g-5 align-items-start">
    <section class="col-lg-4"><p class="eyebrow">CSV intake</p><h1>Start an import</h1><p class="text-secondary">Parents run first, then children. Valid records commit even when other rows fail.</p><form class="surface p-4" method="post" enctype="multipart/form-data" th:action="@{/imports}"><label class="form-label" for="file">CSV file</label><input class="form-control mb-3" id="file" name="file" type="file" accept=".csv,text/csv" required><button class="btn btn-accent w-100" type="submit">Upload and queue</button></form></section>
    <section class="col-lg-8"><h2 class="h3 mb-3">Import history</h2><div th:if="${#lists.isEmpty(imports)}" class="empty-state">No imports have been submitted.</div><div th:unless="${#lists.isEmpty(imports)}" class="surface table-responsive"><table class="table align-middle mb-0"><thead><tr><th>File</th><th>Status</th><th>Progress</th><th></th></tr></thead><tbody><tr th:each="item : ${imports}"><td><strong th:text="${item.originalFilename}"></strong><br><small class="text-secondary" th:text="${item.createdAt}"></small></td><td><span class="status-pill" th:text="${item.status}"></span></td><td th:text="|${item.processedRows} / ${item.totalRows}|"></td><td class="text-end"><a class="btn btn-sm btn-outline-dark" th:href="@{/imports/{id}(id=${item.id})}">Details</a></td></tr></tbody></table></div></section>
  </div>
</main>
</body>
</html>
