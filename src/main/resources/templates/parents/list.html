<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<main class="container py-5">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <header class="d-flex justify-content-between align-items-end mb-4">
    <div><p class="eyebrow" th:text="#{parent.list.eyebrow}">Registry</p><h1 class="display-6 mb-0" th:text="#{parent.list.title}">Parents</h1></div>
    <a class="btn btn-accent" th:href="@{/parents/new}" th:text="#{parent.list.new}">New parent</a>
  </header>
  <div th:if="${#lists.isEmpty(parents)}" class="empty-state" th:text="#{parent.list.empty}">No parents yet.</div>
  <div th:unless="${#lists.isEmpty(parents)}" class="table-responsive surface">
    <table class="table align-middle mb-0">
      <thead><tr><th th:text="#{label.name}">Name</th><th th:text="#{label.identifier}">Identifier</th><th th:text="#{label.updated}">Updated</th><th></th></tr></thead>
      <tbody><tr th:each="parent : ${parents}">
        <td class="fw-semibold" th:text="${parent.displayName}"></td>
        <td><code th:text="${parent.id}"></code></td>
        <td th:text="${parent.updatedAt}"></td>
        <td class="text-end"><a class="btn btn-sm btn-outline-dark" th:href="@{/parents/{id}(id=${parent.id})}" th:text="#{action.open}">Open</a></td>
      </tr></tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
