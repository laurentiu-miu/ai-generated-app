services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: file_importer
      POSTGRES_USER: file_importer
      POSTGRES_PASSWORD: file_importer
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_importer -d file_importer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
